<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papa Terminal — Enter PIN</title>
<style>
  :root {
    --bg: #141414; --surface: #1b1b1b; --surface-2: #232323; --border: #2a2a2a; --border-strong: #363636;
    --text: #e4e4e4; --muted: #999999; --red: #e5534b; --amber: #d4a03d; --blue: #4184f3;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; padding: 24px;
  }
  .login-card { width: 100%; max-width: 340px; }
  .brand { text-align: center; font-weight: 600; font-size: 18px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 28px 0; }
  .pin-boxes { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; }
  .pin-box { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border-strong); font-size: 0; }
  .pin-box.filled { background: var(--text); border-color: var(--text); }
  .pin-box.error { border-color: var(--red); }
  #pin-input { position: absolute; opacity: 0; height: 44px; width: 1px; pointer-events: none; }
  .message { text-align: center; font-size: 14px; margin-bottom: 18px; }
  .message.error { color: var(--red); }
  .message.locked { color: var(--amber); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .keypad button {
    min-height: 60px; background: transparent; border: none; color: var(--text); border-radius: 50%;
    font-size: 24px; font-weight: 400; cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: inherit;
  }
  .keypad button:active { background: var(--surface-2); }
  .keypad button:disabled { opacity: 0.3; cursor: default; }
  .keypad .key-empty { visibility: hidden; }
  .keypad .key-back { font-size: 20px; color: var(--muted); }
  .unlock-btn { width: 100%; min-height: 46px; background: var(--blue); color: #fff; border: none; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .unlock-btn:disabled { opacity: 0.45; cursor: default; }
  noscript p { text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">Papa Terminal</div>
    <p class="subtitle">Enter your 6-digit PIN</p>

    {% if locked_seconds %}
    <div class="message locked">Too many attempts. Try again in {{ locked_seconds }}s.</div>
    {% elif error %}
    <div class="message error">Incorrect PIN{% if attempts_left is not none %} — {{ attempts_left }} attempt{{ "s" if attempts_left != 1 else "" }} left{% endif %}.</div>
    {% endif %}

    <form method="post" action="/login" id="pin-form">
      <input type="hidden" name="next" value="{{ next or '/' }}" />
      <input
        id="pin-input" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
        autocomplete="off" maxlength="6" autofocus
        {{ 'disabled' if locked_seconds else '' }}
      />
      <div class="pin-boxes" id="pin-boxes" aria-hidden="true">
        <span class="pin-box{{ ' error' if error else '' }}"></span>
        <span class="pin-box{{ ' error' if error else '' }}"></span>
        <span class="pin-box{{ ' error' if error else '' }}"></span>
        <span class="pin-box{{ ' error' if error else '' }}"></span>
        <span class="pin-box{{ ' error' if error else '' }}"></span>
        <span class="pin-box{{ ' error' if error else '' }}"></span>
      </div>

      <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <span class="key-empty"></span>
        <button type="button" data-key="0">0</button>
        <button type="button" class="key-back" data-key="back">&larr;</button>
      </div>

      <button type="submit" class="unlock-btn" id="unlock-btn" {{ 'disabled' if locked_seconds else '' }}>Unlock</button>
    </form>
    <noscript><p style="margin-top:16px;">JavaScript is off — type your PIN above and press Unlock.</p></noscript>
  </div>

  <script nonce="{{ csp_nonce }}">
    (function () {
      const input = document.getElementById('pin-input');
      const boxes = document.querySelectorAll('.pin-box');
      const keypad = document.getElementById('keypad');
      const form = document.getElementById('pin-form');
      const locked = {{ 'true' if locked_seconds else 'false' }};

      function render() {
        const val = input.value;
        boxes.forEach((box, i) => {
          box.classList.toggle('filled', i < val.length);
          
        });
      }
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 6);
        render();
        if (input.value.length === 6 && !locked) form.requestSubmit();
      });
      render();

      if (!locked) {
        keypad.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-key]');
          if (!btn) return;
          const key = btn.dataset.key;
          if (key === 'back') {
            input.value = input.value.slice(0, -1);
          } else if (input.value.length < 6) {
            input.value += key;
          }
          input.dispatchEvent(new Event('input'));
        });
        input.focus();
      }
    })();
  </script>
</body>
</html>
